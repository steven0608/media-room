<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Still Water</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b1026">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230B1026'/%3E%3Cpath d='M5 20q5.5-5 11 0t11 0' stroke='%235CE1E6' stroke-width='2.5' fill='none'/%3E%3Ccircle cx='21' cy='10' r='3.5' fill='%23CFD8FF'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    { "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
    } }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="3D media room preview"></canvas>

  <!-- Pairing: shown the first time a headset connects -->
  <div class="overlay hidden" id="pairing">
    <div class="card hero" role="dialog" aria-labelledby="pair-title">
      <h1 id="pair-title" data-i18n-html="pair.title">Pair this <span>headset</span></h1>
      <p class="muted" data-i18n="pair.sub">Type the 6-digit code shown in the Still Water Hub window on your PC.</p>
      <button class="btn primary big hidden" id="pair-near" type="button">Connect</button>
      <form id="pair-form" autocomplete="off">
        <div class="code" id="code-boxes"></div>
        <p class="error" id="pair-error" role="alert"></p>
        <button class="btn primary" type="submit" data-i18n="pair.button">Pair</button>
      </form>
      <p class="muted" style="margin:14px 0 6px;font-size:14px" data-i18n="pair.noHub">No hub yet?</p>
      <button class="btn" id="pair-demo" type="button" data-i18n="connect.demo">Try the demo</button>
    </div>
  </div>

  <!-- Welcome -->
  <div class="overlay hidden" id="welcome">
    <div class="card hero">
      <h1><span data-i18n="app.name">Still Water</span></h1>
      <p class="muted" id="welcome-sub">Your music, films and karaoke, on a quiet lake.</p>
      <div class="row">
        <button class="btn primary" id="enter-vr" disabled>Checking VR…</button>
        <button class="btn" id="preview" data-i18n="welcome.preview">Desktop preview</button>
        <button class="btn primary hidden" id="welcome-unlock">Unlock</button>
        <button class="btn hidden" id="welcome-demo" data-i18n="connect.demo">Try the demo</button>
        <button class="btn" id="lang-welcome" data-i18n="lang.switch" aria-label="Language / 语言">中文</button>
      </div>
      <p class="muted" style="margin-top:14px;font-size:14px" id="welcome-note"></p>
    </div>
  </div>

  <div class="hud hidden" id="hud">
    <div class="card chip" id="hud-status">…</div>
    <div class="row" style="gap:8px">
      <div class="card keys" id="hud-keys" data-i18n-html="hud.keys"></div>
      <button class="btn small card" id="lang-hud" data-i18n="lang.switch" aria-label="Language / 语言">中文</button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
